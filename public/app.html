<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitLife — Panel Administrativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>

<div class="shell" id="shell">

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <i class="bi bi-lightning-charge-fill"></i>
      <span>FitLife</span>
    </div>

    <nav class="sidebar__nav">

      <a href="#/" class="nav-item" data-path="/">
        <i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span>
      </a>

      <div class="nav-section">AFILIADOS</div>
      <a href="#/afiliados" class="nav-item" data-path="/afiliados">
        <i class="bi bi-people-fill"></i><span>Afiliados</span>
      </a>
      <a href="#/seguimientos" class="nav-item" data-path="/seguimientos">
        <i class="bi bi-activity"></i><span>Seguimientos</span>
      </a>

      <div class="nav-section">PERSONAL</div>
      <a href="#/empleados" class="nav-item" data-path="/empleados">
        <i class="bi bi-person-badge-fill"></i><span>Empleados</span>
      </a>
      <a href="#/especialidades" class="nav-item" data-path="/especialidades">
        <i class="bi bi-award-fill"></i><span>Especialidades</span>
      </a>

      <div class="nav-section">ENTRENAMIENTO</div>
      <a href="#/rutinas" class="nav-item" data-path="/rutinas">
        <i class="bi bi-journal-richtext"></i><span>Rutinas</span>
      </a>
      <a href="#/ejercicios" class="nav-item" data-path="/ejercicios">
        <i class="bi bi-bicycle"></i><span>Ejercicios</span>
      </a>
      <a href="#/ejercicios-rutina" class="nav-item" data-path="/ejercicios-rutina">
        <i class="bi bi-diagram-3-fill"></i><span>Ejercicios × Rutina</span>
      </a>
      <a href="#/clases-grupales" class="nav-item" data-path="/clases-grupales">
        <i class="bi bi-person-video3"></i><span>Clases Grupales</span>
      </a>
      <a href="#/horarios" class="nav-item" data-path="/horarios">
        <i class="bi bi-calendar-week-fill"></i><span>Horarios</span>
      </a>
      <a href="#/planes-nutricionales" class="nav-item" data-path="/planes-nutricionales">
        <i class="bi bi-egg-fried"></i><span>Planes Nutricionales</span>
      </a>

      <div class="nav-section">FINANZAS</div>
      <a href="#/planes" class="nav-item" data-path="/planes">
        <i class="bi bi-card-list"></i><span>Planes</span>
      </a>
      <a href="#/pagos" class="nav-item" data-path="/pagos">
        <i class="bi bi-cash-stack"></i><span>Pagos</span>
      </a>

      <div class="nav-section">INFRAESTRUCTURA</div>
      <a href="#/sedes" class="nav-item" data-path="/sedes">
        <i class="bi bi-building-fill"></i><span>Sedes</span>
      </a>
      <a href="#/ciudades" class="nav-item" data-path="/ciudades">
        <i class="bi bi-geo-alt-fill"></i><span>Ciudades</span>
      </a>
      <a href="#/estados" class="nav-item" data-path="/estados">
        <i class="bi bi-map-fill"></i><span>Estados</span>
      </a>
      <a href="#/paises" class="nav-item" data-path="/paises">
        <i class="bi bi-globe-americas"></i><span>Países</span>
      </a>
      <a href="#/tipos-documento" class="nav-item" data-path="/tipos-documento">
        <i class="bi bi-file-earmark-person-fill"></i><span>Tipos Documento</span>
      </a>

    </nav>
  </aside>

  <!-- ══════════════ MAIN ══════════════ -->
  <div class="main-wrapper">

    <header class="topbar">
      <button class="btn-icon-plain" id="sidebarToggle" title="Alternar menú">
        <i class="bi bi-list"></i>
      </button>
      <span class="topbar__title" id="pageTitle">Dashboard</span>
      <div class="topbar__right">
        <span class="status-dot" id="statusDot"></span>
        <span class="topbar__api-label" id="statusLabel">API</span>
      </div>
    </header>

    <main class="content" id="app">
      <div class="loading-fullscreen"><div class="spinner"></div></div>
    </main>

  </div>
</div>

<!-- ══════════════ MODAL GLOBAL ══════════════ -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Formulario</h3>
      <button class="btn-icon-plain" id="modalClose" title="Cerrar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn--ghost" id="modalCancel">Cancelar</button>
      <button class="btn btn--primary" id="modalSave">
        <i class="bi bi-check-lg"></i> Guardar
      </button>
    </div>
  </div>
</div>

<!-- ══════════════ TOAST ══════════════ -->
<div class="toast-container" id="toastContainer"></div>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
